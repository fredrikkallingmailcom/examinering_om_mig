<!doctype html>
<html lang="en">

<head>
    <title>About me</title>
    <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="The mystery and answers of the question: who is Fredrik Kallin?">
    <link href="icon.png" rel="icon" type="image/png">
    <link href="style.css" rel="stylesheet">
    <script src="script_terminal.js" defer></script>
</head>

<body>
    <div class="screen">
        <header class="system_bar">
            <span class="system_logo">
                <a href="index.html"><img src="images/KaOS_logo.png" id="KaOS_logo" alt="Logo"></a>
            </span>
            <time class="system_time" datetime="">
                14:02
            </time>
            <p class="system_status">case-file</p>
            <nav class="system_bar_nav">
                <a href="case_file.html">Case file</a>
                <a href="desktop.html">Desktop</a>
                <a href="terminal.html">Terminal</a>
            </nav>
        </header>
        <main class="main_screen_content">
            <section id="desktop" class="desktop">
                <div class="desktop_column columnOne">
                    <button class="desktop_item">
                        <figure>
                            <img src="images/notes_desktop.png" class="desktop_icon" alt="Notes">
                            <figcaption>Notes</figcaption>
                        </figure>
                    </button>
                    <button class="desktop_item">
                        <figure>
                            <img src="images/case_file_desktop.png" class="desktop_icon" alt="Case file">
                            <figcaption>Case file</figcaption>
                        </figure>
                    </button>
                    <button class="desktop_item">
                        <figure>
                            <img src="images/evidence_desktop.png" class="desktop_icon" alt="Evidence">
                            <figcaption>Evidence</figcaption>
                        </figure>
                    </button>
                </div>
                <div class="desktop_column columnTwo">
                    <button class="desktop_item">
                        <figure>
                            <img src="images/terminal_desktop.png" class="desktop_icon" alt="Terminal">
                            <figcaption>Terminal</figcaption>
                        </figure>
                    </button>
                    <button class="desktop_item">
                        <figure>
                            <img src="images/photos_desktop.png" class="desktop_icon" alt="Photos">
                            <figcaption>Photos</figcaption>
                        </figure>
                    </button>
                </div>
            </section>
        </main>
        <footer class="status_bar">
            <p>> System recovery interrupted.</p>
        </footer>
    </div>
</body>

</html>
