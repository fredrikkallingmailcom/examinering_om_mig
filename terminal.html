<!doctype html>
<html lang="en">

<head>
    <title>Ka-OS 1.0 - Terminal</title>
    <meta charset="UTF-8">
    <meta name="description" content="The mystery and answers of the question: who is Fredrik Kallin?">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="style.css" rel="stylesheet">
    <script src="script_terminal.js" defer></script>
</head>

<body>
    <div class="screen">
        <header class="system_bar">
            <span class="system_logo">
                <a href="index.html"><img src="images/kaos_logo.png" id="kaos_logo" alt="KaOs 1.0"></a>
            </span>
            <time class="system_time" datetime="14:02">
                14:02
            </time>
            <p class="system_status">case-file</p>
            <nav class="system_bar_nav">
                <a href="case_file.html">Case file</a>
                <a href="desktop.html">Desktop</a>
                <a href="terminal.html" aria-current="page">Terminal</a>
            </nav>
        </header>
        <main class="main_screen_content terminal_desktop">
            <section id="terminal_window" class="terminal_window">
                <header class="terminal_titlebar">
                    <p class="terminal_tab">
                        <span>▰</span>
                        <span>Command Prompt</span>
                    </p>
                    <div class="terminal_window_buttons">
                        <button type="button" aria-label="Minimize">-</button>
                        <button type="button" aria-label="Maximize">□</button>
                        <button type="button" id="close_terminal" aria-label="Close">x</button>
                    </div>
                </header>
                <section class="terminal">
                    <h1>Command Prompt</h1>
                    <p>
                        Fredsoft Frindows [Version 11.0.23200.9457]
                        (c) Fredsoft Corporation. All rights reserved.
                    </p>
                    <p>
                        Help: write 'help' in the terminal to print all commands.
                    </p>
                    <div class="terminal_output_input">
                        <ul id="terminal_output_list"></ul>
                    </div>
                </section>
            </section>
        </main>
        <footer class="status_bar">
            <p>> System recovery interrupted.</p>
        </footer>
    </div>
</body>

</html>
